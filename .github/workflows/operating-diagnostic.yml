name: NFL operating diagnostic

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capability only by default; campaign requires separate exact authorization
        required: true
        type: choice
        default: capability
        options: [capability, campaign]
      source_sha:
        description: Exact approved installed development commit; must equal actual dispatch SHA
        required: true
        type: string
      campaign_id:
        description: Existing frozen fictional campaign identity
        required: true
        type: string
        default: NFL-WEB-OPERATING-SEED-THREE-20261020-B3
      artifact_approval_json:
        description: Campaign only; separately approved technical artifact manifest, exact UTF-8 bytes
        required: false
        type: string
      artifact_approval_sha256:
        description: Campaign only; ordinary SHA-256 of exact supplied technical approval bytes
        required: false
        type: string
      confirm_nonpublishing:
        description: Enter READ_ONLY_NO_PROVIDER_NO_UPLOAD after exact invocation approval
        required: true
        type: string
      confirm_runner_privilege:
        description: Enter ONE_RUN_LOCAL_RESOURCE_UNIT after exact privilege approval
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: nfl-operating-diagnostic-${{ github.repository }}
  cancel-in-progress: false

jobs:
  operating_1:
    name: Operating sample 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CAMPAIGN_ID: NFL-WEB-OPERATING-SEED-THREE-20261020-B3
      SAMPLE_NUMBER: 1
    steps:
      - name: Guard exact first invocation and initialize private bytecode path
        shell: bash
        run: |
          set -euo pipefail
          task_initial_prefix="$(mktemp -d "$RUNNER_TEMP/nfl-operating-initial-pyc.XXXXXX")"
          chmod 0700 "$task_initial_prefix"
          export PYTHONPYCACHEPREFIX="$task_initial_prefix"
          printf 'PYTHONPYCACHEPREFIX=%s\n' "$task_initial_prefix" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib, json, os, re, stat, time
          from datetime import datetime, timezone
          from pathlib import Path
          fd=os.open(os.environ['GITHUB_EVENT_PATH'],os.O_RDONLY|os.O_NOFOLLOW)
          try:
              info=os.fstat(fd)
              if not stat.S_ISREG(info.st_mode) or info.st_size>131072:raise RuntimeError('Bounded dispatch event required')
              raw=os.read(fd,131073)
          finally:os.close(fd)
          if len(raw)>131072:raise RuntimeError('Dispatch event exceeded bound')
          event=json.loads(raw);inputs=event.get('inputs',{})
          exact={'GITHUB_ACTIONS':'true','RUNNER_ENVIRONMENT':'github-hosted',
              'GITHUB_EVENT_NAME':'workflow_dispatch','GITHUB_RUN_ATTEMPT':'1',
              'GITHUB_REPOSITORY':'NickNicky19/nicks-expert-nfl-picks','GITHUB_REPOSITORY_ID':'1411185749',
              'GITHUB_ACTOR_ID':'208912933','GITHUB_REF_NAME':'upgrade/phase2-reproducible-comparison'}
          if any(os.environ.get(k)!=v for k,v in exact.items()):raise RuntimeError('Unapproved dispatch context')
          if not re.fullmatch('[0-9a-f]{40}',os.environ.get('GITHUB_SHA','')) or inputs.get('source_sha')!=os.environ['GITHUB_SHA']:
              raise RuntimeError('Actual source differs from approved dispatch')
          if (inputs.get('campaign_id')!=os.environ['CAMPAIGN_ID'] or inputs.get('mode') not in ('capability','campaign')
              or inputs.get('confirm_nonpublishing')!='READ_ONLY_NO_PROVIDER_NO_UPLOAD'
              or inputs.get('confirm_runner_privilege')!='ONE_RUN_LOCAL_RESOURCE_UNIT'):
              raise RuntimeError('Required exact invocation confirmations missing')
          if inputs['mode']=='capability' and os.environ['SAMPLE_NUMBER']!='1':raise RuntimeError('Capability mode is one job only')
          if inputs['mode']=='capability':
              if inputs.get('artifact_approval_json','') or inputs.get('artifact_approval_sha256',''):
                  raise RuntimeError('Capability invocation must not include seed or artifact approval')
          else:
              if not re.fullmatch('[0-9a-f]{64}',inputs.get('artifact_approval_sha256','')):raise RuntimeError('Exact approval checksum missing')
              approval=inputs.get('artifact_approval_json','').encode('utf-8')
              if not 0<len(approval)<=32768 or hashlib.sha256(approval).hexdigest()!=inputs['artifact_approval_sha256']:
                  raise RuntimeError('Exact approval bytes differ')
          start={'schema_version':'operating-setup-start-v1','run_id':int(os.environ['GITHUB_RUN_ID']),
              'sample':int(os.environ['SAMPLE_NUMBER']),'utc':datetime.now(timezone.utc).isoformat(),'monotonic':time.monotonic()}
          target=Path(os.environ['RUNNER_TEMP'])/('operating-setup-start-'+os.environ['SAMPLE_NUMBER']+'.json')
          with target.open('x') as stream:json.dump(start,stream,sort_keys=True,allow_nan=False)
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              stream.write('OPERATING_MODE='+inputs['mode']+'\n')
              if inputs['mode']=='campaign':stream.write('OPERATING_ARTIFACT_APPROVAL_SHA256='+inputs['artifact_approval_sha256']+'\n')
          print('Exact first-attempt nonpublishing dispatch guards passed; no operating claim')
          PY

      - name: Checkout actual dispatched development source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up matching Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up matching Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install existing dependencies without external compiled-cache records
        shell: bash
        run: |
          set -euo pipefail
          task_pip_prefix="$(mktemp -d "$RUNNER_TEMP/nfl-operating-pip-pyc.XXXXXX")"
          chmod 0700 "$task_pip_prefix"
          PYTHONPYCACHEPREFIX="$task_pip_prefix" python -m pip install --no-compile -r requirements.txt

      - name: Bind complete owner artifact approval without publishing its contents
        shell: bash
        run: |
          set -euo pipefail
          task_approval_prefix="$(mktemp -d "$RUNNER_TEMP/nfl-operating-approval-pyc.XXXXXX")"
          chmod 0700 "$task_approval_prefix"
          PYTHONPYCACHEPREFIX="$task_approval_prefix" python - <<'PY'
          import hashlib, json, os, stat, sys
          from pathlib import Path
          code=Path(os.environ['GITHUB_WORKSPACE']).resolve();sys.path.insert(0,str(code/'tools'))
          import operating_seed_transport as transport
          fd=os.open(os.environ['GITHUB_EVENT_PATH'],os.O_RDONLY|os.O_NOFOLLOW)
          try:
              info=os.fstat(fd)
              if not stat.S_ISREG(info.st_mode) or info.st_size>131072:raise RuntimeError('Bounded dispatch event required')
              raw=os.read(fd,131073)
          finally:os.close(fd)
          if len(raw)>131072:raise RuntimeError('Dispatch event exceeded bound')
          inputs=json.loads(raw)['inputs']
          if os.environ['OPERATING_MODE']=='campaign':
              approval=inputs['artifact_approval_json'].encode('utf-8')
              if not 0<len(approval)<=32768 or hashlib.sha256(approval).hexdigest()!=os.environ['OPERATING_ARTIFACT_APPROVAL_SHA256']:
                  raise RuntimeError('Approval bytes changed')
              path=Path(os.environ['RUNNER_TEMP'])/'operating-artifact-approval.json'
              fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
              with os.fdopen(fd,'wb') as stream:stream.write(approval)
              checked=transport.read_approval(path,os.environ['OPERATING_ARTIFACT_APPROVAL_SHA256'])
              with Path(os.environ['GITHUB_ENV']).open('a') as stream:stream.write('SEED_MANIFEST_SHA256='+checked['seed_manifest_sha256']+'\n')
          elif os.environ['OPERATING_MODE']=='capability':
              if inputs.get('artifact_approval_json','') or inputs.get('artifact_approval_sha256',''):
                  raise RuntimeError('Capability invocation must not include seed or artifact approval')
          else:raise RuntimeError('Unsupported operating mode')
          bootstrap=code/'tools/operating_resource_bootstrap.py'
          fd=os.open(bootstrap,os.O_RDONLY|os.O_NOFOLLOW)
          try:
              info=os.fstat(fd)
              if not stat.S_ISREG(info.st_mode) or info.st_size>2*1024**2:raise RuntimeError('Bounded exact bootstrap required')
              bootstrap_raw=os.read(fd,2*1024**2+1)
          finally:os.close(fd)
          if len(bootstrap_raw)>2*1024**2 or hashlib.sha256(bootstrap_raw).hexdigest()!='720a6cc48fb22b97a44d1095bb08215aea98479e597a919b4b4cfef6a7043e94':
              raise RuntimeError('Root bootstrap differs from the exact reviewed bytes')
          print('Exact bootstrap verified; campaign approval required only for campaign, capability has no seed')
          PY

      - name: Run exact transient resource unit with named read-only token transport
        id: execute
        shell: bash
        env:
          GH_TOKEN: ${{ inputs.mode == 'campaign' && github.token || '' }}
        run: |
          set -euo pipefail
          task_unit="nfl-operating-$GITHUB_RUN_ID-$SAMPLE_NUMBER.service"
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$SAMPLE_NUMBER" =~ ^[123]$ ]]
          task_code="$GITHUB_WORKSPACE"
          task_py="$(command -v python)"
          task_node="$(readlink -f "$(command -v node)")"
          task_git="$(readlink -f "$(command -v git)")"
          task_runtime_prefix="$(mktemp -d "$RUNNER_TEMP/nfl-operating-runtime-pyc.XXXXXX")"
          chmod 0700 "$task_runtime_prefix"
          task_paths="$RUNNER_TEMP/operating-critical-$SAMPLE_NUMBER.paths"
          PYTHONPYCACHEPREFIX="$task_runtime_prefix" "$task_py" - <<'PY' > "$task_paths"
          import os, requests, sys, sysconfig
          from pathlib import Path
          values=[Path(sys.executable).resolve(),Path(requests.__file__).resolve(),Path(sys.prefix),Path(sys.base_prefix)]
          values.extend(Path(v) for v in sysconfig.get_paths().values() if v)
          for value in dict.fromkeys(map(str,values)):
              if '\n' in value or '\r' in value:raise RuntimeError('Unsupported runtime path')
              print(value)
          PY
          task_memtotal="$(awk '$1=="MemTotal:" {printf "%.0f\n", $2*1024}' /proc/meminfo)"
          [[ "$task_memtotal" =~ ^[1-9][0-9]*$ ]]
          task_parent_prefix="$(mktemp -d "$RUNNER_TEMP/nfl-operating-parent-pyc.XXXXXX")"
          chmod 0700 "$task_parent_prefix"
          task_work="$RUNNER_TEMP/nfl-operating-$SAMPLE_NUMBER"
          task_root_report="/var/tmp/nfl-operating-$GITHUB_RUN_ID-$SAMPLE_NUMBER"
          task_critical=(--critical-path "$task_code" --critical-path "$task_code/tools" --critical-path "$task_code/.git/objects"
            --critical-path "$RUNNER_TEMP" --critical-path "$task_work" --critical-path "$task_work/fixture"
            --critical-path "$task_work/retrieved-seed" --critical-path "$task_work/sample-pages"
            --critical-path "$task_work/admission-pages" --critical-path "$task_work/restart-checkout"
            --critical-path "$task_work/restart-pages" --critical-path "$task_work/logs"
            --critical-path "$task_work/sample-artifact.tar" --critical-path "$task_work/admission-artifact.tar"
            --critical-path "$task_work/RESULT.json"
            --critical-path "$task_root_report" --critical-path "$RUNNER_TEMP/operating-artifact-approval.json"
            --critical-path /tmp --critical-path /var/tmp --critical-path "$HOME"
            --critical-path "$task_node" --critical-path "$task_git")
          while IFS= read -r task_path; do task_critical+=(--critical-path "$task_path"); done < "$task_paths"
          task_mode=()
          if [[ "$OPERATING_MODE" == capability ]]; then task_mode+=(--capability-only); fi
          task_setenv=(--setenv=GH_TOKEN
            "--setenv=PATH=$PATH" "--setenv=HOME=$HOME" "--setenv=TMPDIR=$RUNNER_TEMP"
            "--setenv=RUNNER_TEMP=$RUNNER_TEMP" "--setenv=GITHUB_WORKSPACE=$task_code"
            "--setenv=GITHUB_ACTIONS=$GITHUB_ACTIONS" "--setenv=RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
            "--setenv=GITHUB_RUN_ID=$GITHUB_RUN_ID" "--setenv=GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            "--setenv=GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME" "--setenv=GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
            "--setenv=GITHUB_REPOSITORY_ID=$GITHUB_REPOSITORY_ID" "--setenv=GITHUB_ACTOR_ID=$GITHUB_ACTOR_ID"
            "--setenv=GITHUB_REF_NAME=$GITHUB_REF_NAME" "--setenv=GITHUB_SHA=$GITHUB_SHA"
            "--setenv=GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF" "--setenv=GITHUB_JOB=$GITHUB_JOB"
            "--setenv=CAMPAIGN_ID=$CAMPAIGN_ID" "--setenv=ImageOS=$ImageOS" "--setenv=ImageVersion=$ImageVersion"
            "--setenv=RUNNER_OS=$RUNNER_OS" "--setenv=RUNNER_ARCH=$RUNNER_ARCH"
            --setenv=PYTHONDONTWRITEBYTECODE=1 "--setenv=PYTHONPYCACHEPREFIX=$task_parent_prefix")
          if [[ "$OPERATING_MODE" == campaign ]]; then
            task_setenv+=("--setenv=SEED_MANIFEST_SHA256=$SEED_MANIFEST_SHA256"
              "--setenv=OPERATING_ARTIFACT_APPROVAL_SHA256=$OPERATING_ARTIFACT_APPROVAL_SHA256")
          fi
          if [[ -n "${LD_LIBRARY_PATH:-}" ]]; then task_setenv+=("--setenv=LD_LIBRARY_PATH=$LD_LIBRARY_PATH"); fi
          task_ancestor_prefix="$(mktemp -d "$RUNNER_TEMP/nfl-ancestor-preflight.XXXXXX")"
          chmod 0700 "$task_ancestor_prefix"
          PYTHONPYCACHEPREFIX="$task_ancestor_prefix" "$task_py" -P - <<'PYANCESTORS'
          import json,stat
          from pathlib import Path
          def require_existing_ancestors(parents):
              result=[]
              for parent in parents:
                  info=parent.lstat()
                  if parent.is_symlink() or parent.resolve()!=parent or not stat.S_ISDIR(info.st_mode) or info.st_uid!=0 or info.st_mode&0o022:
                      raise RuntimeError('UNPROTECTED_EXISTING_ANCESTOR')
                  values={}
                  for name in ('cgroup.controllers','cgroup.subtree_control'):
                      control=parent/name;item=control.lstat()
                      if control.is_symlink() or control.resolve()!=control or not stat.S_ISREG(item.st_mode) or item.st_uid!=0 or item.st_mode&0o022:
                          raise RuntimeError('UNPROTECTED_EXISTING_ANCESTOR_CONTROL')
                      with control.open('rb') as stream:raw=stream.read(4097)
                      if len(raw)>4096 or b'memory' not in raw.split():
                          raise RuntimeError('EXISTING_ANCESTOR_MEMORY_REQUIRED')
                      values[name]=raw.hex()
                  result.append(values)
              return result
          value=require_existing_ancestors((Path('/sys/fs/cgroup'),Path('/sys/fs/cgroup/system.slice')))
          print(json.dumps({'status':'EXISTING_ANCESTOR_MEMORY_CONFIRMED_BEFORE_PRIVILEGE','ancestors':value},sort_keys=True))
          PYANCESTORS
          trap 'task_exit=$?; sudo -n /usr/bin/systemctl stop "$task_unit" >/dev/null 2>&1 || :; exit "$task_exit"' EXIT
          sudo -n --preserve-env=GH_TOKEN /usr/bin/systemd-run             --unit "$task_unit" --working-directory="$task_code" --wait --collect --service-type=exec             -p User=root -p UMask=0022 -p MemoryAccounting=yes -p "MemoryMax=$task_memtotal" -p MemorySwapMax=0             -p Delegate=memory -p DelegateSubgroup=supervisor -p RuntimeMaxSec=1230 -p TimeoutStopSec=30             -p KillMode=control-group -p StandardOutput=null -p StandardError=null             "${task_setenv[@]}"             "$task_py" -P "$task_code/tools/operating_resource_bootstrap.py"             --unit "$task_unit" --memory-max "$task_memtotal" --uid "$(id -u)" --gid "$(id -g)"             --run-id "$GITHUB_RUN_ID" --sample "$SAMPLE_NUMBER" --code "$task_code"             "${task_critical[@]}" "${task_mode[@]}" >/dev/null 2>&1

      - name: Always stop and read back only the exact diagnostic unit
        id: cleanup
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$SAMPLE_NUMBER" =~ ^[123]$ ]]
          task_unit="nfl-operating-$GITHUB_RUN_ID-$SAMPLE_NUMBER.service"
          sudo -n /usr/bin/systemctl stop "$task_unit" >/dev/null 2>&1 || :
          task_state="$(sudo -n /usr/bin/systemctl show "$task_unit" --property=ActiveState --value 2>/dev/null || :)"
          if [[ "$task_state" == active || "$task_state" == activating || "$task_state" == deactivating              || -d "/sys/fs/cgroup/system.slice/$task_unit" ]]; then
            printf 'inactive=false\n' >> "$GITHUB_OUTPUT"
            printf 'Exact diagnostic unit cleanup could not be established\n'
            exit 1
          fi
          task_load="$(sudo -n /usr/bin/systemctl show "$task_unit" --property=LoadState --value 2>/dev/null || :)"
          if [[ "$task_state" != inactive && "$task_state" != failed && "$task_load" != not-found ]]; then
            printf 'inactive=false\n' >> "$GITHUB_OUTPUT"
            printf 'Exact diagnostic unit state is unavailable\n'
            exit 1
          fi
          printf 'inactive=true\n' >> "$GITHUB_OUTPUT"
          printf 'Exact diagnostic unit inactive and cgroup absent; original seed untouched\n'

      - name: Emit only the closed bounded technical measurement projection
        if: always()
        timeout-minutes: 2
        shell: bash
        env:
          UNIT_INACTIVE: ${{ steps.cleanup.outputs.inactive }}
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          task_projection="$RUNNER_TEMP/operating-projection-$SAMPLE_NUMBER.json"
          task_project_rc=1
          if [[ "$UNIT_INACTIVE" == true && -f "$GITHUB_WORKSPACE/tools/operating_campaign.py" ]]; then
            task_projection_prefix="$(mktemp -d "$RUNNER_TEMP/nfl-operating-projection-pyc.XXXXXX")"
            chmod 0700 "$task_projection_prefix"
            set +e
            PYTHONPYCACHEPREFIX="$task_projection_prefix" timeout --signal=TERM --kill-after=5s 60s               python "$GITHUB_WORKSPACE/tools/operating_campaign.py" project               --code "$GITHUB_WORKSPACE" --root "$RUNNER_TEMP/nfl-operating-$SAMPLE_NUMBER/fixture"               --result "$RUNNER_TEMP/nfl-operating-$SAMPLE_NUMBER/RESULT.json" --sample-number "$SAMPLE_NUMBER"               2>/dev/null | head -c 65537 > "$task_projection"
            task_project_rc=${PIPESTATUS[0]}
            set -e
          fi
          export OPERATING_PROJECT_RC="$task_project_rc"
          task_emit_prefix="$(mktemp -d "$RUNNER_TEMP/nfl-operating-emit-pyc.XXXXXX")"
          chmod 0700 "$task_emit_prefix"
          PYTHONPYCACHEPREFIX="$task_emit_prefix" python - <<'PY'
          import json, os, stat
          from pathlib import Path
          schema='operating-measurement-projection-v1'
          value={'schema_version':schema,'status':'UNKNOWN','reason':'PROJECTION_OR_EXACT_UNIT_CLEANUP_UNAVAILABLE',
              'run_id':int(os.environ['GITHUB_RUN_ID']),'sample':int(os.environ['SAMPLE_NUMBER']),'source':os.environ['GITHUB_SHA']}
          path=Path(os.environ['RUNNER_TEMP'])/('operating-projection-'+os.environ['SAMPLE_NUMBER']+'.json')
          if os.environ.get('UNIT_INACTIVE')=='true' and os.environ.get('OPERATING_PROJECT_RC')=='0' and path.is_file() and not path.is_symlink():
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)
              try:
                  info=os.fstat(fd)
                  raw=os.read(fd,65537) if stat.S_ISREG(info.st_mode) and info.st_size<=65536 else b''
              finally:os.close(fd)
              if 0<len(raw)<=65536:
                  try:
                      candidate=json.loads(raw)
                      if type(candidate) is dict and candidate.get('schema_version')==schema:value=candidate
                  except (ValueError,UnicodeError):pass
          raw=json.dumps(value,sort_keys=True,separators=(',',':'),allow_nan=False)
          if len(raw.encode())>65536:raise RuntimeError('Projection exceeds approved bound')
          print('NFL_OPERATING_MEASUREMENT '+raw)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write('Diagnostic mode: '+os.environ.get('OPERATING_MODE','unknown')+'; sample '+os.environ['SAMPLE_NUMBER']+'; projection '+str(value.get('status','UNKNOWN'))+'.\n')
              stream.write('Preparation, source correctness and operating qualification remain separate. No provider, upload or deployment action.\n')
          PY
  operating_2:
    needs: operating_1
    if: ${{ inputs.mode == 'campaign' && !cancelled() }}
    name: Operating sample 2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CAMPAIGN_ID: NFL-WEB-OPERATING-SEED-THREE-20261020-B3
      SAMPLE_NUMBER: 2
    steps:
      - name: Guard exact first invocation and initialize private bytecode path
        shell: bash
        run: |
          set -euo pipefail
          task_initial_prefix="$(mktemp -d "$RUNNER_TEMP/nfl-operating-initial-pyc.XXXXXX")"
          chmod 0700 "$task_initial_prefix"
          export PYTHONPYCACHEPREFIX="$task_initial_prefix"
          printf 'PYTHONPYCACHEPREFIX=%s\n' "$task_initial_prefix" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib, json, os, re, stat, time
          from datetime import datetime, timezone
          from pathlib import Path
          fd=os.open(os.environ['GITHUB_EVENT_PATH'],os.O_RDONLY|os.O_NOFOLLOW)
          try:
              info=os.fstat(fd)
              if not stat.S_ISREG(info.st_mode) or info.st_size>131072:raise RuntimeError('Bounded dispatch event required')
              raw=os.read(fd,131073)
          finally:os.close(fd)
          if len(raw)>131072:raise RuntimeError('Dispatch event exceeded bound')
          event=json.loads(raw);inputs=event.get('inputs',{})
          exact={'GITHUB_ACTIONS':'true','RUNNER_ENVIRONMENT':'github-hosted',
              'GITHUB_EVENT_NAME':'workflow_dispatch','GITHUB_RUN_ATTEMPT':'1',
              'GITHUB_REPOSITORY':'NickNicky19/nicks-expert-nfl-picks','GITHUB_REPOSITORY_ID':'1411185749',
              'GITHUB_ACTOR_ID':'208912933','GITHUB_REF_NAME':'upgrade/phase2-reproducible-comparison'}
          if any(os.environ.get(k)!=v for k,v in exact.items()):raise RuntimeError('Unapproved dispatch context')
          if not re.fullmatch('[0-9a-f]{40}',os.environ.get('GITHUB_SHA','')) or inputs.get('source_sha')!=os.environ['GITHUB_SHA']:
              raise RuntimeError('Actual source differs from approved dispatch')
          if (inputs.get('campaign_id')!=os.environ['CAMPAIGN_ID'] or inputs.get('mode') not in ('capability','campaign')
              or inputs.get('confirm_nonpublishing')!='READ_ONLY_NO_PROVIDER_NO_UPLOAD'
              or inputs.get('confirm_runner_privilege')!='ONE_RUN_LOCAL_RESOURCE_UNIT'):
              raise RuntimeError('Required exact invocation confirmations missing')
          if inputs['mode']=='capability' and os.environ['SAMPLE_NUMBER']!='1':raise RuntimeError('Capability mode is one job only')
          if inputs['mode']=='capability':
              if inputs.get('artifact_approval_json','') or inputs.get('artifact_approval_sha256',''):
                  raise RuntimeError('Capability invocation must not include seed or artifact approval')
          else:
              if not re.fullmatch('[0-9a-f]{64}',inputs.get('artifact_approval_sha256','')):raise RuntimeError('Exact approval checksum missing')
              approval=inputs.get('artifact_approval_json','').encode('utf-8')
              if not 0<len(approval)<=32768 or hashlib.sha256(approval).hexdigest()!=inputs['artifact_approval_sha256']:
                  raise RuntimeError('Exact approval bytes differ')
          start={'schema_version':'operating-setup-start-v1','run_id':int(os.environ['GITHUB_RUN_ID']),
              'sample':int(os.environ['SAMPLE_NUMBER']),'utc':datetime.now(timezone.utc).isoformat(),'monotonic':time.monotonic()}
          target=Path(os.environ['RUNNER_TEMP'])/('operating-setup-start-'+os.environ['SAMPLE_NUMBER']+'.json')
          with target.open('x') as stream:json.dump(start,stream,sort_keys=True,allow_nan=False)
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              stream.write('OPERATING_MODE='+inputs['mode']+'\n')
