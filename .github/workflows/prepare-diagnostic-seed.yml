      actions: read
    steps:
      - name: Diagnose read-only Runner.Worker metadata access without running a workload
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """One read-only topology observation, never memory or operating qualification."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys
          import time

          CONFIRMATION = 'NFL-WEB-RUNNER-MEMORY-DETAIL-20261024'
          WORKFLOW = 'NickNicky19/nicks-expert-nfl-picks/.github/workflows/prepare-diagnostic-seed.yml@refs/heads/upgrade/phase2-reproducible-comparison'
          LIMIT = 16384

          class Unsupported(Exception):
              pass

          def require(condition, code):
              if not condition:raise Unsupported(code)

          def canonical(value):return json.dumps(value,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          def sha(value):return hashlib.sha256(value).hexdigest()
          def pairs(items):
              result={}
              for key,value in items:
                  require(key not in result,'DUPLICATE_JSON_KEY');result[key]=value
              return result


          # Closed metadata-only diagnostic context; never emit paths or exception text.
          CONTEXT = {'phase':'INVOCATION','role':'EVENT','operation':'OPEN'}
          COUNTERS = ('memory.current','memory.peak','memory.max','memory.swap.current','memory.swap.peak','memory.swap.max')
          def operation(role, action):
              CONTEXT.update(role=role, operation=action)
          def metadata_role(path):
              value=str(path)
              fixed={'/proc/self/mountinfo':'SELF_MOUNTINFO','/proc/meminfo':'MEMINFO','/proc/1/ns/cgroup':'PID1_CGROUP_NAMESPACE'}
              if value in fixed:return fixed[value]
              if re.fullmatch(r'/proc/[1-9][0-9]{0,19}/stat',value):return 'ANCESTOR_STAT'
              if re.fullmatch(r'/proc/[1-9][0-9]{0,19}/exe',value):return 'ANCESTOR_EXE'
              if re.fullmatch(r'/proc/[1-9][0-9]{0,19}/cgroup',value):return 'ANCESTOR_MEMBERSHIP'
              if re.fullmatch(r'/proc/[1-9][0-9]{0,19}/ns/cgroup',value):return 'ANCESTOR_CGROUP_NAMESPACE'
              if Path(value).name in COUNTERS:return 'CGROUP_'+Path(value).name.upper().replace('.','_')
              if Path(value).name=='memory.events':return 'CGROUP_MEMORY_EVENTS'
              return 'EVENT_OR_REQUIRED_METADATA'
          def failure(error):
              result=dict(CONTEXT)
              if isinstance(error,OSError):
                  result['error']='OS_ERROR'
                  result['errno']={1:'EPERM',2:'ENOENT',5:'EIO',13:'EACCES',20:'ENOTDIR',40:'ELOOP',116:'ESTALE'}.get(error.errno,'OTHER_OR_UNAVAILABLE')
              elif isinstance(error,Unsupported):
                  # The fixed guard code, never exception text from a library or OS.
                  result['error']='REQUIRED_GUARD_REJECTED'
              else:result['error']='METADATA_PARSE_REJECTED'
              return result
          def readlink(path):
              operation(metadata_role(path),'READLINK')
              return os.readlink(path)

          def read(path,limit=16384):
              operation(metadata_role(path),'OPEN')
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC)
              try:
                  operation(metadata_role(path),'FSTAT')
                  require(stat.S_ISREG(os.fstat(fd).st_mode),'NONREGULAR_METADATA')
                  parts=[];size=0
                  while True:
                      operation(metadata_role(path),'READ')
                      data=os.read(fd,min(4096,limit-size+1))
                      if not data:break
                      size+=len(data);require(size<=limit,'METADATA_SIZE_BOUND');parts.append(data)
                  return b''.join(parts)
              finally:os.close(fd)

          def integer(raw,maximum=None):
              text=raw.strip()
              require(re.fullmatch(rb'0|[1-9][0-9]{0,19}',text) is not None,'MALFORMED_COUNTER')
              value=int(text)
              require(maximum is None or value<=maximum,'COUNTER_BOUND')
              return value

          def maximum(raw):return None if raw.strip()==b'max' else integer(raw)

          def identity(raw,pid):
              require(len(raw)<=16384 and raw.startswith(str(pid).encode()+b' ('),'PROC_IDENTITY')
              end=raw.rfind(b') ');require(end>0,'PROC_IDENTITY')
              fields=raw[end+2:].split();require(len(fields)>=20,'PROC_FIELDS')
