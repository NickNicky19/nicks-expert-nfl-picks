                  final={'status':result['status'],'source':source,'artifact_tar_bytes':(out/'release-review.tar').stat().st_size,'artifact_tar_sha256':file_hash(out/'release-review.tar'),'new_receipts':len(receipts),'operating_qualification':'NOT_ESTABLISHED','resource_verdict':'UNKNOWN'}
              except BaseException as error:
                  final={'status':'FAILED_RETENTION','failure_type':type(error).__name__,'operating_qualification':'NOT_ESTABLISHED','resource_verdict':'UNKNOWN'}
              final['controller_seconds_including_retention']=time.monotonic()-started
              (out/'FINAL.json').write_bytes(canonical(final)+b'\n')
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('payload_ready='+str((out/'release-review.tar').is_file() and (out/'release-review.tar').stat().st_size<=CAP).lower()+'\n')
              print('REAL_CASE_RESULT_JSON='+canonical(final).decode())

          if __name__=='__main__':main()
          PY
      - name: Retain only the one typed bounded genuine release-review payload
        id: real_artifact
        if: ${{ always() && steps.real_case.outputs.payload_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genuine-production-review-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-real-production-case/release-review.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Require the complete genuine case while retaining failures honestly
        if: ${{ always() }}
        shell: bash
        env:
          REVIEW_ARTIFACT_OUTCOME: ${{ steps.real_artifact.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'nfl-real-production-case/FINAL.json'
          assert p.is_file(),'No complete typed genuine-case result exists'
          value=json.loads(p.read_bytes())
          assert os.environ.get('REVIEW_ARTIFACT_OUTCOME')=='success','The bounded review artifact was not successfully retained'
          assert value['status']=='COMPLETE_GENUINE_NONDEPLOY_CASE',value['status']
          assert value['artifact_tar_bytes']<=127*1024**2,'RETENTION_CAP'
          assert value['operating_qualification']=='NOT_ESTABLISHED' and value['resource_verdict']=='UNKNOWN','HONEST_LIMITED_CLAIM'
          print('One genuine nondeploy case completed; operating qualification and deployment remain unestablished.')
          PY
