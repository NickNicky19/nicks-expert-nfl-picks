name: One-time fictional diagnostic seed preparation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact separately approved one-time preparation identifier
        required: true
        type: choice
        default: CANCEL
        options:
          - CANCEL
          - NFL-WEB-CLOUD-SEED-PREP-20261021-045638Z
          - NFL-WEB-CHECKPOINT-READBACK-12509203616-20261023
          - NFL-WEB-CHECKPOINT-READBACK-12540324398-20261024
          - NFL-WEB-CHECKPOINT-FRONTIER-12509203616-20261023
          - NFL-WEB-CONTINUE-VERIFIED-13-OF-24-12509203616-20261023
          - NFL-WEB-CONTINUE-CHECKPOINT-22-OF-24-12540324398-20261024
          - NFL-WEB-RUNNER-MEMORY-READBACK-20261024
          - NFL-WEB-RUNNER-MEMORY-DETAIL-20261024
          - NFL-WEB-GENUINE-PRODUCTION-CASE-20261024
          - NFL-WEB-GENERATED-BROWSER-ACCEPTANCE-20261024
          - NFL-WEB-PUBLIC-BROWSER-ACCEPTANCE-20261024
      storage_approved:
        description: Repeat the preparation identifier after output-content and available-storage approval
        required: true
        type: string
      installed_source:
        description: Exact approved installed development commit, not an application-source override
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.confirmation == 'NFL-WEB-GENERATED-BROWSER-ACCEPTANCE-20261024' && 'one-time-generated-browser-acceptance' || inputs.confirmation == 'NFL-WEB-PUBLIC-BROWSER-ACCEPTANCE-20261024' && 'one-time-public-browser-acceptance' || inputs.confirmation == 'NFL-WEB-RUNNER-MEMORY-DETAIL-20261024' && 'one-time-runner-memory-detail' || inputs.confirmation == 'NFL-WEB-RUNNER-MEMORY-READBACK-20261024' && 'one-time-runner-memory-readback' || inputs.confirmation == 'NFL-WEB-GENUINE-PRODUCTION-CASE-20261024' && 'one-time-genuine-production-case' || 'one-time-fictional-seed-preparation' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'NickNicky19/nicks-expert-nfl-picks' &&
      github.actor_id == '208912933' &&
      github.ref == 'refs/heads/upgrade/phase2-reproducible-comparison' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'NFL-WEB-CLOUD-SEED-PREP-20261021-045638Z' &&
      inputs.storage_approved == 'NFL-WEB-CLOUD-SEED-PREP-20261021-045638Z' &&
      inputs.installed_source == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PREPARATION_ID: NFL-WEB-CLOUD-SEED-PREP-20261021-045638Z
      APPLICATION_SOURCE: b3de2fbd88ba3247b407a856972285ad10527b99
      APPLICATION_TREE: c0d0d818f8e1266f55851c8c220d44cd94797c78
    steps:
      - name: Observe standard runner before allocation
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -r /proc/meminfo
          test -r /proc/self/mountinfo
          df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp "$HOME"
          cat /proc/meminfo

      - name: Retrieve exact diagnostic installer source
        timeout-minutes: 4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: installer
          fetch-depth: 0
          persist-credentials: false

      - name: Retrieve independent accepted application and legacy objects
        timeout-minutes: 4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: b3de2fbd88ba3247b407a856972285ad10527b99
          path: app
          fetch-depth: 0
          persist-credentials: false

      - name: Set up declared Python
        timeout-minutes: 4
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
          check-latest: false

      - name: Set up declared Node
        timeout-minutes: 4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          check-latest: false

      - name: Install exact declared preparation dependencies
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -r "$GITHUB_WORKSPACE/installer/tools/cloud-seed-requirements.txt"
          python --version
          node --version
          python -m pip freeze --all

      - name: Check complete source closure and early capacity
        timeout-minutes: 3
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/installer" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/app" rev-parse HEAD)" = "$APPLICATION_SOURCE"
          test "$(git -C "$GITHUB_WORKSPACE/app" rev-parse 'HEAD^{tree}')" = "$APPLICATION_TREE"
          python "$GITHUB_WORKSPACE/installer/tools/cloud_seed_prepare.py" preflight \
            --app "$GITHUB_WORKSPACE/app" \
            --work "$RUNNER_TEMP/nfl-seedprep-$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/nfl-seedprep-export-$GITHUB_RUN_ID"

      - name: Require existing ancestor memory controllers without changing them
        timeout-minutes: 1
        id: ancestors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, stat
          from pathlib import Path
          root=Path('/sys/fs/cgroup')
          parents=(root,root/'system.slice')
          records=[]
          for parent in parents:
              info=parent.stat()
              if parent.is_symlink() or info.st_uid!=0 or info.st_mode & (stat.S_IWGRP|stat.S_IWOTH):
                  raise RuntimeError('Unprotected ancestor cgroup; no privileged setup attempted')
              controls=parent/'cgroup.subtree_control'
              data=controls.read_bytes()
              records.append({'path':str(parent),'uid':info.st_uid,'gid':info.st_gid,
                  'mode':stat.S_IMODE(info.st_mode),'control_hex':data.hex(),
                  'controllers_hex':(parent/'cgroup.controllers').read_bytes().hex()})
              if b'memory' not in data.split():
                  raise RuntimeError('Ancestor memory controller must already be enabled; no global change permitted')
          mounts=[line for line in Path('/proc/self/mountinfo').read_text().splitlines()
              if ' - cgroup2 ' in line]
          if len(mounts)!=1 or mounts[0].split()[4]!='/sys/fs/cgroup':
              raise RuntimeError('Unsupported cgroup2 mount layout')
          work=Path(os.environ['RUNNER_TEMP'])/('nfl-seedprep-'+os.environ['GITHUB_RUN_ID'])
          (work/'ANCESTORS.before.json').write_text(json.dumps({'mounts':mounts,'ancestors':records},sort_keys=True)+'\n')
          PY

      - name: Prepare once inside attributable resource and inherited network boundaries
        timeout-minutes: 306
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          installer="$GITHUB_WORKSPACE/installer"
          app="$GITHUB_WORKSPACE/app"
          work="$RUNNER_TEMP/nfl-seedprep-$GITHUB_RUN_ID"
          output="$RUNNER_TEMP/nfl-seedprep-export-$GITHUB_RUN_ID"
          py="$(command -v python)"
          node_bin="$(command -v node)"
          py_actual="$(readlink -f "$py")"
          node_actual="$(readlink -f "$node_bin")"
          requests_file="$("$py" -c 'import requests; print(requests.__file__)')"
          memtotal="$(awk '$1=="MemTotal:" {printf "%.0f\n", $2*1024}' /proc/meminfo)"
          test -n "$memtotal"
          sudo systemd-run --unit "nfl-seedprep-$GITHUB_RUN_ID.service" \
            --wait --pipe --collect --service-type=exec \
            -p User=root -p UMask=0022 \
            -p MemoryAccounting=yes -p "MemoryMax=$memtotal" -p MemorySwapMax=0 \
            -p Delegate=memory -p DelegateSubgroup=supervisor \
            -p RuntimeMaxSec=18300 -p TimeoutStopSec=30 -p KillMode=control-group \
            /usr/bin/env -i \
            "PATH=$(dirname "$py"):$(dirname "$node_bin"):/usr/bin:/bin" \
            "HOME=$HOME" "TMPDIR=$RUNNER_TEMP" "RUNNER_TEMP=$RUNNER_TEMP" \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            "GITHUB_WORKSPACE=$installer" "GITHUB_SHA=$GITHUB_SHA" \
            "$py" "$installer/tools/cloud_seed_resource_bootstrap.py" \
            --unit "nfl-seedprep-$GITHUB_RUN_ID.service" --memory-max "$memtotal" \
            --uid "$(id -u)" --gid "$(id -g)" --run-id "$GITHUB_RUN_ID" \
            --output "$work/RESOURCE.json" \
            --critical-path "$installer" --critical-path "$app" \
            --critical-path "$work" --critical-path "$output" \
            --critical-path "$RUNNER_TEMP" --critical-path /tmp --critical-path "$HOME" \
            --critical-path "$py_actual" --critical-path "$node_actual" --critical-path "$requests_file" \
            --timeout 18000 -- \
            "$py" "$installer/tools/diagnostic_network_guard.py" -- \
            "$py" "$installer/tools/cloud_seed_prepare.py" run \
            --app "$app" --work "$work" --output "$output"

      - name: Verify ancestor controller settings remained unchanged
        timeout-minutes: 1
        if: always() && steps.ancestors.outcome == 'success'
        id: ancestor_check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, stat
          from pathlib import Path
          work=Path(os.environ['RUNNER_TEMP'])/('nfl-seedprep-'+os.environ['GITHUB_RUN_ID'])
          old=json.loads((work/'ANCESTORS.before.json').read_text())
          now=[]
          for record in old['ancestors']:
              parent=Path(record['path']);info=parent.stat()
              now.append({'path':str(parent),'uid':info.st_uid,'gid':info.st_gid,
                  'mode':stat.S_IMODE(info.st_mode),'control_hex':(parent/'cgroup.subtree_control').read_bytes().hex(),
                  'controllers_hex':(parent/'cgroup.controllers').read_bytes().hex()})
          mounts=[line for line in Path('/proc/self/mountinfo').read_text().splitlines() if ' - cgroup2 ' in line]
          result={'mounts':mounts,'ancestors':now}
          (work/'ANCESTORS.after.json').write_text(json.dumps(result,sort_keys=True)+'\n')
          if result!=old:raise RuntimeError('Unexpected ancestor controller/mount/ownership change; no automatic global restoration permitted')
          PY

      - name: Finalize only bounded allowlisted retention contents
        timeout-minutes: 2
        if: always() && steps.preflight.outcome == 'success'
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/installer/tools/cloud_seed_prepare.py" finalize \
            --app "$GITHUB_WORKSPACE/app" \
            --work "$RUNNER_TEMP/nfl-seedprep-$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/nfl-seedprep-export-$GITHUB_RUN_ID"

      - name: Retain only explicitly approved fictional seed or bounded failure checkpoint
        timeout-minutes: 15
        id: upload
        if: always() && steps.finalize.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fictional-seed-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-seedprep-export-${{ github.run_id }}/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Require complete admitted restoration and actual resource verdict
        timeout-minutes: 1
        if: always() && steps.finalize.outcome == 'success'
        shell: bash
        env:
          ANCESTOR_CHECK_OUTCOME: ${{ steps.ancestor_check.outcome }}
          PREPARATION_STEP_OUTCOME: ${{ steps.prepare.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ACTUAL_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ACTUAL_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ACTUAL_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          output=Path(os.environ['RUNNER_TEMP'])/('nfl-seedprep-export-'+os.environ['GITHUB_RUN_ID'])
          manifest=json.loads((output/'ARTIFACT_MANIFEST.json').read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write('Preparation: '+manifest['preparation_status']+'; resources: '+manifest['resource_verdict']+'; operating: NOT_RUN\n\n')
              for key in ('ACTUAL_ARTIFACT_ID','ACTUAL_ARTIFACT_DIGEST','ACTUAL_ARTIFACT_URL'):
                  stream.write(key+': '+os.environ.get(key,'')+'\n\n')
          if os.environ['UPLOAD_OUTCOME']!='success':
              raise RuntimeError('Approved output retention failed; runner-local files are not a completed transfer')
          if manifest['preparation_status']!='PREPARATION_COMPLETE_NOT_OPERATING_QUALIFIED':
              raise RuntimeError('No complete admitted/restored full seed; bounded retained failure is not success')
          if manifest['resource_verdict']!='PASS':
              raise RuntimeError('Actual supported resource qualification did not pass')
          if os.environ['ANCESTOR_CHECK_OUTCOME']!='success' or os.environ['PREPARATION_STEP_OUTCOME']!='success':
              raise RuntimeError('Preparation service or ancestor-integrity boundary failed')
          if manifest['operating_qualification']!='NOT_RUN':
              raise RuntimeError('Preparation must not claim hosted operating qualification')
          print('ONE_TIME_PREPARATION_COMPLETE; OPERATING_CAMPAIGN_NOT_RUN')
          PY

  inspect-retained-failure:
    if: >-
      github.repository == 'NickNicky19/nicks-expert-nfl-picks' &&
      github.actor_id == '208912933' &&
      github.ref == 'refs/heads/upgrade/phase2-reproducible-comparison' &&
      github.run_attempt == 1 &&
      (inputs.confirmation == 'NFL-WEB-CHECKPOINT-READBACK-12509203616-20261023' ||
       inputs.confirmation == 'NFL-WEB-CHECKPOINT-READBACK-12540324398-20261024') &&
      inputs.storage_approved == 'READ_ONLY_EXISTING_ARTIFACT_NO_UPLOAD' &&
      inputs.installed_source == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Retrieve exact readback source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up declared readback Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
          check-latest: false
      - name: Verify the one retained failed checkpoint and report bounded technical results
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_READBACK_ID: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          python - <<'PY'
          """One fixed failed fictional artifact: inspect bytes, never qualify a seed."""
          import gzip
          import hashlib
          import json
          import math
          import re
          import os
          from pathlib import Path
          import stat
          import subprocess
          import sys
          import tarfile
          import tempfile
          import time
          import zipfile
          
          sys.dont_write_bytecode = True
          sys.path.insert(0, str(Path(os.environ.get('GITHUB_WORKSPACE', '.')) / 'tools'))
          import source_ci
          import operating_seed_transport as transport
          
          READBACK_ID = os.environ['CHECKPOINT_READBACK_ID']
          PROFILES = {
              'NFL-WEB-CHECKPOINT-READBACK-12509203616-20261023': (
                  39940028362, 12509203616, '1b592af659cec56fe87440cf679d69d7fc41590e',
                  '49ddc936c1ba3f47bb038c7250eb82c6e0a91393', 998031473,
                  'e9a1be3a3580d01a51b39375d7d908ba37300b02e83ab6ccf2e2732540b9876c',
                  '2026-10-30T14:45:09Z', 'bfb48f36d1db5b2980235238e1b869efb183f23095ff72cee33c1d88e84a3b26'),
              'NFL-WEB-CHECKPOINT-READBACK-12540324398-20261024': (
                  40017092249, 12540324398, '4855732886ce0da65ccf3af13928049149f33ea8',
                  '2dfb1d661a073f2cb997d03157beb79b970f818c', 2092241565,
                  'd5060fb316f4626144b71ebbf6d774f7c644f2568f92b2e5b89efd10c04ac18d',
                  '2026-10-27T00:21:55Z', 'ed5b6773c3d4e642bf4346aa2b9de89a2b580a1f34e97bddc6172b068a388611'),
          }
          RUN, ARTIFACT, HEAD, TREE, SIZE, DIGEST, EXPIRES, INTEGRITY = PROFILES[READBACK_ID]
          CURRENT = READBACK_ID == 'NFL-WEB-CHECKPOINT-READBACK-12540324398-20261024'
          BASE = 'b3de2fbd88ba3247b407a856972285ad10527b99'
          EXTRA = {'INCOMPLETE_CHECKPOINT.tar.gz', 'INCOMPLETE_SOURCE_CLOSURE.bundle', 'INCOMPLETE_MANIFEST.json'}
          ALLOWED = transport.SEED_FILES | transport.JSON_FILES | EXTRA
          CHUNK = 1024 ** 2
          
          
          def require(condition, message):
              if not condition: raise ValueError(message)
          
          
          def matches(record, expected):
              return all(type(record.get(k)) is type(v) and record[k] == v for k, v in expected.items())
          
          
          def identity(api):
              repo = api.get('')
              require((repo.get('id'), repo.get('full_name'), repo.get('private')) ==
                      (1411185749, source_ci.REPOSITORY, False), 'Repository identity')
              for path in (f'/actions/runs/{RUN}', f'/actions/runs/{RUN}/attempts/1'):
                  run = api.get(path)
                  expected = dict(id=RUN, run_attempt=1, head_sha=HEAD, workflow_id=392359637,
                                  path='.github/workflows/prepare-diagnostic-seed.yml', event='workflow_dispatch',
                                  head_branch='upgrade/phase2-reproducible-comparison', status='completed', conclusion='failure')
                  require(matches(run, expected) and
                          (run.get('actor') or {}).get('id') == 208912933 and
                          (run.get('repository') or {}).get('id') == 1411185749 and
                          (run.get('head_repository') or {}).get('id') == 1411185749, 'Failed first-attempt identity')
              artifact = api.get(f'/actions/artifacts/{ARTIFACT}')
              expected = dict(id=ARTIFACT, name=f'fictional-seed-preparation-{RUN}', size_in_bytes=SIZE,
                              digest='sha256:' + DIGEST, expired=False, expires_at=EXPIRES)
              require(matches(artifact, expected), 'Artifact identity')
              link = artifact.get('workflow_run') or {}
              require(all(link.get(k) == v for k, v in dict(id=RUN, head_sha=HEAD,
                      repository_id=1411185749, head_repository_id=1411185749).items()), 'Artifact origin')
              require(transport._stamp(EXPIRES).timestamp() > time.time(), 'Expired artifact')
              return artifact
          
          
          def contents(path, deadline):
              count = transport._zip_inventory(path)
              inventory, metadata = {}, {}
              total = json_bytes = 0
              progress = None
              with zipfile.ZipFile(path) as zipped:
                  require(len(zipped.infolist()) == count, 'ZIP count')
                  for item in zipped.infolist():
                      transport._check(deadline)
                      name = item.filename
                      require(item.orig_filename == name and name in ALLOWED and name not in inventory and
                              not item.is_dir() and item.external_attr >> 16 & 0o170000 in (0, stat.S_IFREG) and
                              not item.flag_bits & 1 and item.compress_type in (0, 8), 'Unsafe artifact member')
                      require(0 <= item.file_size <= transport.LIMIT and total + item.file_size <= transport.LIMIT, 'Decoded bound')
                      is_json = name.endswith('.json')
                      require(not is_json or json_bytes + item.file_size <= transport.JSON_LIMIT, 'Aggregate JSON bound')
                      digest, length, parts = hashlib.sha256(), 0, []
                      with zipped.open(item) as source:
                          while True:
                              transport._check(deadline)
                              raw = source.read(min(CHUNK, item.file_size + 1 - length))
                              transport._check(deadline)
                              if not raw: break
                              length += len(raw)
                              require(length <= item.file_size, 'Grown member')
                              digest.update(raw)
                              if is_json: parts.append(raw)
                      require(length == item.file_size, 'Truncated member')
                      inventory[name] = dict(bytes=length, sha256=digest.hexdigest())
                      total += length
                      if is_json:
                          metadata[name] = source_ci.decoded(b''.join(parts), transport.JSON_LIMIT)
                          require(isinstance(metadata[name], dict), 'Technical JSON object')
                          json_bytes += length
                  require({'ARTIFACT_MANIFEST.json', 'PREPARATION_RESULT.json', 'RESOURCE.json', 'PREFLIGHT.json'} <= metadata.keys(), 'Required technical results')
                  envelope = metadata['ARTIFACT_MANIFEST.json']
                  require(envelope.get('schema_version') == 'cloud-seed-artifact-envelope-v1' and
                          envelope.get('files') == {k: v for k, v in inventory.items() if k != 'ARTIFACT_MANIFEST.json'}, 'Complete actual inventory')
                  require((envelope.get('application_source'), envelope.get('installer'), envelope.get('operating_qualification')) ==
                          (BASE, dict(head=HEAD, tree=TREE), 'NOT_RUN'), 'Producer source/qualification')
                  require(envelope.get('integrity_sha256') == INTEGRITY and
                          metadata['PREFLIGHT.json'].get('installer') == dict(head=HEAD, tree=TREE), 'Actual original installer')
                  result = metadata['PREPARATION_RESULT.json']
                  require(result.get('application_source') == BASE and result.get('status') == 'PREPARATION_FAILED' and
                          result.get('application_tree') == 'c0d0d818f8e1266f55851c8c220d44cd94797c78' and
                          result.get('harness_sha256') == '441f0ccaa1b274708419643d993896b5ff6f2c4118e0016719c80a1746289328' and
                          result.get('input_contract_sha256') == '56c10c8c7e26a4ffd18c5838115c587f7bce7930a6bd078e49527dc2f0bc1cad' and
                          envelope.get('preparation_status') == result['status'], 'Failure inspection only')
                  if 'INCOMPLETE_MANIFEST.json' in metadata:
                      checkpoint = metadata['INCOMPLETE_MANIFEST.json']
                      require(checkpoint.get('status') == 'INCOMPLETE_NOT_ADMITTED_NOT_RESUME_AUTHORIZED' and
                              checkpoint.get('application_source') == BASE, 'Explicit incomplete checkpoint')
                      require(inventory.get('INCOMPLETE_CHECKPOINT.tar.gz') ==
                              dict(bytes=checkpoint.get('archive_bytes'), sha256=checkpoint.get('archive_sha256')), 'Checkpoint bytes')
                      bundle = checkpoint.get('git_bundle')
                      if bundle:
                          require(inventory.get(bundle.get('name')) == {k: bundle.get(k) for k in ('bytes', 'sha256')}, 'Bundle bytes')
                      descriptor = (checkpoint.get('files') or {}).get('CONSTRUCTION_PROGRESS.json')
                      if descriptor:
                          with zipped.open('INCOMPLETE_CHECKPOINT.tar.gz') as source, gzip.GzipFile(fileobj=source) as tar:
                              info = tarfile.TarInfo.frombuf(tar.read(512), 'utf-8', 'strict')
                              require(info.name == 'CONSTRUCTION_PROGRESS.json' and info.isreg() and 0 <= info.size <= CHUNK, 'Bounded progress role')
                              raw = tar.read(info.size)
                              require(len(raw) == info.size and dict(bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest()) == descriptor, 'Progress actual bytes')
                              progress = source_ci.decoded(raw, CHUNK)
                              require(isinstance(progress, dict) and set(progress) == {'generation', 'target', 'wall_clock'} and
                                      type(progress['generation']) is int and type(progress['target']) is int and
                                      0 <= progress['generation'] <= progress['target'] == 24, 'Typed recorded progress')
              return metadata, inventory, progress
          
          
          def aggregate(metadata, inventory, progress, actual):
              # A nonqualifying projection of authenticated bytes, never raw errors/paths.
              p, r = metadata['PREPARATION_RESULT.json'], metadata['RESOURCE.json']
              names = ('frontier', 'construct', 'admit', 'gate', 'freeze', 'restore', 'recheck')
              stages = p.get('stages'); require(type(stages) is list and len(stages) <= len(names), 'Stage count')
              projected = []
              for i, item in enumerate(stages):
                  require(type(item) is dict and item.get('name') == names[i] and
                          item.get('status') in ('PASS', 'FAIL', 'RUNNING'), 'Known ordered stage')
                  seconds = item.get('exclusive_seconds')
                  require(seconds is None or type(seconds) in (int, float) and math.isfinite(seconds) and
                          0 <= seconds <= 86400, 'Stage duration')
                  projected.append(dict(name=names[i], status=item['status'], exclusive_seconds=seconds))
              failure = p.get('failure'); require(type(failure) is str, 'Failure record')
              failure_raw = failure.encode(); error = failure.partition(':')[0]
              allowed_errors = {'RuntimeError', 'TimeoutError', 'ValueError', 'OSError', 'MemoryError',
                                'CalledProcessError', 'KeyboardInterrupt', 'FileNotFoundError'}
              error = error if error in allowed_errors else 'OTHER_ERROR'
              code = {'TimeoutError: Fixed preparation core deadline exhausted': 'CORE_DEADLINE',
                      'RuntimeError: Bounded private stage log exceeded': 'PRIVATE_LOG_CAP'}.get(failure, 'UNCLASSIFIED')
              failed_stage = exit_code = None
              match = re.fullmatch(r'RuntimeError: (frontier|construct|admit|gate|freeze|restore|recheck) failed with exit (-?[0-9]{1,10}); raw diagnostic log retained locally', failure)
              if match:
                  code, failed_stage, exit_code = 'STAGE_EXIT', match[1], int(match[2])
              require(r.get('status') in ('PREFLIGHT_FAILED', 'COMPLETE', 'CAPABILITY_READY',
                      'CAPABILITY_OR_MONITOR_FAILURE', 'HOSTED_PREFLIGHT_STOP') and
                      r.get('resource_verdict') in ('PASS', 'FAIL', 'UNKNOWN', 'NOT_RUN_CAPABILITY_ONLY'), 'Resource status')
              flags = {k: r.get(k) for k in ('complete_tree', 'peak_reset_verified', 'scope_closure_verified', 'privilege_drop_verified')}
              require(all(v is None or type(v) is bool for v in flags.values()), 'Resource flags')
              failures = r.get('failures', [])
              allowed_failures = {'DISK_HEADROOM', 'SUPERVISOR_TIMEOUT', 'DESCENDANTS_REMAIN_AFTER_CLEANUP',
                  'CHANGED_ANCESTOR_LIMIT', 'ANCESTOR_MEMORY_HEADROOM', 'CHANGED_RESOURCE_SCOPE',
                  'WORKLOAD_MEMORY_HEADROOM', 'OOM', 'WORKLOAD_FAILURE'}
              require(type(failures) is list and len(failures) <= len(allowed_failures) and
                      all(type(v) is str and v in allowed_failures for v in failures), 'Known resource failures')
              peaks, events = r.get('kernel_peaks', {}), r.get('event_deltas', {})
              require(type(peaks) is dict and type(events) is dict and len(peaks) <= 8 and len(events) <= 8, 'Scope bounds')
              scopes = []; require(len(set(peaks) | set(events)) <= 8, 'Complete scope bound')
              for i, name in enumerate(sorted(set(peaks) | set(events))):
                  peak = peaks.get(name, {}); event = events.get(name, {})
                  require(type(peak) is dict and type(event) is dict, 'Scope records')
                  values = {k: peak.get(k) for k in ('kernel_peak', 'limit')}
                  values.update({k: event.get(k) for k in ('oom', 'oom_kill', 'oom_group_kill')})
                  require(all(v is None or type(v) is int and 0 <= v < 2**63 for v in values.values()), 'Scope integer')
                  scopes.append(dict(scope=i, **values))
              disks = r.get('filesystem_minima', {}); require(type(disks) is dict and len(disks) <= 8, 'Filesystem bound')
              minima = [{k: v.get(k) for k in ('total', 'free')} for _, v in sorted(disks.items())]
              require(all(type(v['total']) is int and type(v['free']) is int and
                          0 <= v['free'] <= v['total'] < 2**63 for v in minima), 'Filesystem integers')
              counters = [v[k] for v in scopes for k in ('oom', 'oom_kill', 'oom_group_kill')]
              durations = {k: p.get(k) for k in ('driver_seconds', 'core_limit_seconds', 'total_limit_seconds')}
              durations['supervisor_seconds'] = r.get('supervisor_seconds')
              require(all(v is None or type(v) in (int, float) and math.isfinite(v) and 0 <= v <= 86400 for v in durations.values()), 'Timing scalars')
              preservation = (p.get('preservation') or {}).get('status')
              require(preservation in (None, 'INCOMPLETE_NOT_ADMITTED_NOT_RESUME_AUTHORIZED', 'NO_FIXTURE_CREATED', 'RETENTION_FAILED'), 'Preservation status')
              progress = None if progress is None else {k: progress[k] for k in ('generation', 'target')}
              return dict(schema_version='fictional-seed-failure-readback-v2', status='READBACK_INTEGRITY_PASS_PREPARATION_FAILED',
                  readback_source=actual, preparation_source=HEAD, application_source=BASE,
                  preparation_run=RUN, artifact_id=ARTIFACT, artifact_bytes=SIZE, artifact_sha256=DIGEST,
                  expires_at=EXPIRES, preparation_status=p['status'], stages=projected, progress=progress,
                  failure=dict(error_class=error, code=code, stage=failed_stage, exit_code=exit_code,
                               bytes=len(failure_raw), sha256=hashlib.sha256(failure_raw).hexdigest()),
                  preservation_status=preservation, durations=durations,
                  preserved_file_count=len((metadata.get('INCOMPLETE_MANIFEST.json') or {}).get('files') or {}),
                  verified_members=len(inventory), resource=dict(status=r['status'], verdict=r['resource_verdict'],
                      flags=flags, failures=failures, scopes=scopes, filesystem_minima=minima,
                      any_oom=any(v > 0 for v in counters) if counters and all(v is not None for v in counters) else None),
                  preparation_result_sha256=inventory['PREPARATION_RESULT.json']['sha256'],
                  resource_sha256=inventory['RESOURCE.json']['sha256'],
                  generation_count_claim='CHECKPOINT_PROGRESS_ONLY_NOT_REPLAYED', full_seed='NOT_ESTABLISHED',
                  operating_qualification='NOT_RUN', application_or_evidence_writes=False, new_artifact_upload=False)

          def main():
              started = time.monotonic()
              deadline = started + 240
              require(os.environ.get('GITHUB_REPOSITORY_ID') == '1411185749' and
                      os.environ.get('GITHUB_ACTOR_ID') == '208912933' and
                      os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' and
                      os.environ.get('GITHUB_RUN_ATTEMPT') == '1' and
                      os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted' and
                      os.environ.get('GITHUB_REF') == 'refs/heads/upgrade/phase2-reproducible-comparison', 'Trusted readback context')
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              require(actual == os.environ['GITHUB_SHA'], 'Actual readback source')
              binding = source_ci.source(Path(os.environ['GITHUB_WORKSPACE']))
              location = Path(os.environ['RUNNER_TEMP'])
              fs = os.statvfs(location)
              require(fs.f_bavail * fs.f_frsize - SIZE - transport.JSON_LIMIT >=
                      max(2 * 1024 ** 3, .2 * fs.f_blocks * fs.f_frsize), 'Temporary readback disk headroom')
              api = source_ci.GitHub()
              before = identity(api)
              with tempfile.TemporaryDirectory(prefix='nfl-failure-readback-', dir=location) as temp:
                  archive = Path(temp) / 'artifact.zip'
                  # Byte/hash transport only. Never call successful-seed retrieve(),
                  # restore a checkpoint, run builders or claim preparation qualification.
                  transport._download(dict(artifact_id=ARTIFACT, archive_bytes=SIZE, archive_sha256=DIGEST), archive, deadline=deadline)
                  metadata, inventory, progress = contents(archive, deadline)
                  require(identity(api) == before and transport._hash(archive, deadline) == dict(bytes=SIZE, sha256=DIGEST), 'Final actual identity/bytes')
                  preparation, resource = metadata['PREPARATION_RESULT.json'], metadata['RESOURCE.json']
                  if CURRENT:
                      report = aggregate(metadata, inventory, progress, actual)
                  else:
                      report = dict(schema_version='fictional-seed-failure-readback-v1', status='READBACK_INTEGRITY_PASS_PREPARATION_FAILED',
                                    readback_source=actual, preparation_source=HEAD, application_source=BASE,
                                    preparation_run=RUN, artifact_id=ARTIFACT, artifact_bytes=SIZE, artifact_sha256=DIGEST,
                                    expires_at=EXPIRES, preparation_status=preparation['status'], failure=preparation.get('failure'),
                                    stages=preparation.get('stages'), progress=progress, member_inventory=inventory,
                                    preservation_status=(preparation.get('preservation') or {}).get('status'),
                                    preserved_file_count=len((metadata.get('INCOMPLETE_MANIFEST.json') or {}).get('files') or {}),
                                    resource={k: resource.get(k) for k in ('status', 'resource_verdict', 'complete_tree', 'supervisor_seconds',
                                        'failures', 'returncode', 'attributable_scope', 'peak_reset_verified', 'scope_closure_verified', 'privilege_drop_verified')},
                                    kernel_peaks=list((resource.get('kernel_peaks') or {}).values()),
                                    event_deltas=list((resource.get('event_deltas') or {}).values()),
                                    filesystem_minima=[{k: v.get(k) for k in ('total', 'free')} for v in (resource.get('filesystem_minima') or {}).values()],
                                    operating_qualification='NOT_RUN', full_seed='NOT_ADMITTED', application_or_evidence_writes=False,
                                    new_artifact_upload=False)
              require(source_ci.source(Path(os.environ['GITHUB_WORKSPACE'])) == binding, 'Readback source changed')
              report['cleanup_complete'] = True
              report['readback_seconds'] = time.monotonic() - started
              raw = source_ci.canonical(report)
              require(len(raw) <= (8192 if CURRENT else 128 * 1024), 'Bounded technical result')
              print('CHECKPOINT_READBACK_JSON=' + raw.decode())
              print('CHECKPOINT_READBACK_SHA256=' + hashlib.sha256(raw).hexdigest())
          
          
          if __name__ == '__main__':
              try: main()
              except BaseException as error:
                  # Never expose signed URLs, credentials, response bodies or raw logs.
                  print('CHECKPOINT_READBACK_REJECTED=' + type(error).__name__, file=sys.stderr)
                  raise SystemExit(1) from None
          PY

  inspect-committed-frontier:
    if: >-
      github.repository == 'NickNicky19/nicks-expert-nfl-picks' &&
      github.actor_id == '208912933' &&
      github.ref == 'refs/heads/upgrade/phase2-reproducible-comparison' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'NFL-WEB-CHECKPOINT-FRONTIER-12509203616-20261023' &&
      inputs.storage_approved == 'READ_ONLY_EXISTING_ARTIFACT_NO_UPLOAD' &&
      inputs.installed_source == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Retrieve exact inspector source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up declared inspection Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
          check-latest: false

      - name: Set up declared inspection Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          check-latest: false

      - name: Install pinned existing inspection dependencies
        timeout-minutes: 4
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r tools/cloud-seed-requirements.txt

      - name: Retrieve only the exact retained failed checkpoint with early capacity checks
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -u "$GITHUB_WORKSPACE/tools/seed_checkpoint_frontier.py" retrieve \
            --work "$RUNNER_TEMP/nfl-seed-frontier-$GITHUB_RUN_ID"

      - name: Cold restore and replay committed history with inherited network denial
        timeout-minutes: 50
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/tools/diagnostic_network_guard.py" -- \
            python -u "$GITHUB_WORKSPACE/tools/seed_checkpoint_frontier.py" verify \
            --work "$RUNNER_TEMP/nfl-seed-frontier-$GITHUB_RUN_ID"

      - name: State the limited inspection claim without publishing fixture records
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/('nfl-seed-frontier-'+os.environ['GITHUB_RUN_ID'])/'FRONTIER.json'
          value={}
          if path.is_file() and not path.is_symlink() and path.stat().st_size<=131072:
              value=json.loads(path.read_bytes())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write('Checkpoint inspection: '+value.get('status','NO_COMPLETED_REPLAY_RESULT')+'\n\n')
              stream.write('Retained original artifact:12509203616; expiry2026-10-30T14:45:09Z.\n\n')
              stream.write('Full seed:NOT_ADMITTED; continuation:NOT_AUTHORIZED_BY_INSPECTION; operating:NOT_RUN.\n\n')
              stream.write('No construction, provider collection, privilege, upload, production write or deployment.\n')
          PY

  prepare-continuation:
    if: >-
      github.repository == 'NickNicky19/nicks-expert-nfl-picks' &&
      github.actor_id == '208912933' &&
      github.ref == 'refs/heads/upgrade/phase2-reproducible-comparison' &&
