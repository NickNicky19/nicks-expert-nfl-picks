       inputs.confirmation == 'NFL-WEB-CONTINUE-CHECKPOINT-22-OF-24-12540324398-20261024') &&
      inputs.storage_approved == inputs.confirmation &&
      inputs.installed_source == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      PREPARATION_ID: ${{ inputs.confirmation }}
      CONTINUATION_ID: ${{ inputs.confirmation }}
      APPLICATION_SOURCE: b3de2fbd88ba3247b407a856972285ad10527b99
      APPLICATION_TREE: c0d0d818f8e1266f55851c8c220d44cd94797c78
    steps:
      - name: Observe standard runner before allocation
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -r /proc/meminfo
          test -r /proc/self/mountinfo
          df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp "$HOME"
          cat /proc/meminfo
          python - <<'PYEARLY'
          import os
          from pathlib import Path
          gib=1024**3
          # Conservative setup plus complete retained-checkpoint/work/export peak.
          for location in (Path(os.environ['GITHUB_WORKSPACE']),Path(os.environ['RUNNER_TEMP']),Path('/tmp'),Path(os.environ['HOME'])):
              fs=os.statvfs(location)
              if fs.f_bavail*fs.f_frsize-16*gib<max(2*gib,fs.f_blocks*fs.f_frsize//5):
                  raise RuntimeError('Insufficient complete continuation disk headroom before allocation')
          memory={k:int(v.split()[0])*1024 for k,v in (line.split(':',1) for line in Path('/proc/meminfo').read_text().splitlines()) if v.strip().split() and v.strip().split()[0].isdigit()}
          if memory['MemAvailable']-8*gib<max(2*gib,memory['MemTotal']//5):
              raise RuntimeError('Insufficient continuation memory headroom before allocation')
          PYEARLY

      - name: Retrieve exact diagnostic installer source
        timeout-minutes: 4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: installer
          fetch-depth: 0
          persist-credentials: false

      - name: Retrieve independent accepted application and legacy objects
        timeout-minutes: 4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: b3de2fbd88ba3247b407a856972285ad10527b99
          path: app
          fetch-depth: 0
          persist-credentials: false

      - name: Set up declared Python
        timeout-minutes: 4
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
          check-latest: false

      - name: Set up declared Node
        timeout-minutes: 4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          check-latest: false

      - name: Install exact declared preparation dependencies
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -r "$GITHUB_WORKSPACE/installer/tools/cloud-seed-requirements.txt"
          python --version
          node --version
          python -m pip freeze --all

      - name: Retrieve exact failed artifact for this single closed continuation
        timeout-minutes: ${{ inputs.confirmation == 'NFL-WEB-CONTINUE-CHECKPOINT-22-OF-24-12540324398-20261024' && 16 || 5 }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
