      - name: Publish only bounded sanitized acceptance metadata
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python -P - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/('nfl-public-browser-'+os.environ['GITHUB_RUN_ID'])/'report/BROWSER_ACCEPTANCE.json'
          fallback={'schema_version':'genuine-generated-browser-acceptance-v1','status':'FAIL','rejected_stage':'SETUP_OR_SOURCE','resource_verdict':'UNKNOWN','operating_qualification':'NOT_ESTABLISHED','provider_calls':0,'deployment':False}
          allowed=set('schema_version browser_failure_stage browser_failure_kind browser_failure_viewport browser_reader_code browser_exit_code diagnostic_source capture_source diagnostic_manifest_sha256 capture_manifest_sha256 new_source_ci_run_id old_source_ci_run_id new_source_ci_seal_sha256 old_source_ci_seal_sha256 new_source_ci_environment_sha256 old_source_ci_environment_sha256 new_source_ci_verification_sha256 old_source_ci_verification_sha256 source_compatibility_sha256 diagnostic_source_differences status resource_verdict operating_qualification provider_calls deployment source case_run_id hourly_run_id runtime_source runtime_data_commit public_members_verified target artifact_id artifact_sha256 tar_sha256 generation_sha256 report_sha256 browser_script_sha256 private_report_sha256 validation viewports category_source_side_cases saved_ticket_count unavailable_case_count playwright_version chrome_version physical_device saved_rows supporting_groups populated_cache_contexts strategy_ui_contexts rejected_stage failure_class'.split())
          try:
              assert p.is_file() and not p.is_symlink() and p.stat().st_size<=8192
              value=json.loads(p.read_bytes());assert isinstance(value,dict) and set(value)<=allowed
              assert value['schema_version']==fallback['schema_version'] and value['resource_verdict']=='UNKNOWN' and value['operating_qualification']=='NOT_ESTABLISHED' and value['provider_calls']==0 and value['deployment'] is False
              for key,item in value.items():
                  if key.endswith('sha256'):assert isinstance(item,str) and re.fullmatch('[0-9a-f]{64}',item)
                  elif key=='source':assert item==os.environ['GITHUB_SHA']
                  elif key in ('runtime_source','runtime_data_commit'):assert isinstance(item,str) and re.fullmatch('[0-9a-f]{40}',item)
                  elif key=='browser_failure_stage':assert item in ["B001","B002","B003","B004","B005","B006","B007","B008","B009","B010","B011","B012","B013","B014","B015","B016","B017","B018","B019","B020","B021","B022","B023","B024","B025","B026","B027","B028","B029","UNAVAILABLE","INVALID"]
                  elif key=='browser_failure_kind':assert item in ["ASSERTION","TIMEOUT","TYPE","REFERENCE","SYNTAX","RANGE","ERROR","OTHER","MODULE_NOT_FOUND","ENOENT","EACCES","ENOSPC","ENOMEM","FILESYSTEM_GUARD","BROWSER_DEADLINE","UNAVAILABLE","INVALID"]
                  elif key=='browser_failure_viewport':assert type(item) is int and item in (0,1280,390,320)
                  elif key=='browser_reader_code':assert item in ('FILESYSTEM_HEADROOM','PREINSTALLED_CHROME_UNAVAILABLE','BROWSER_CHECKS_REJECTED','ACTUAL_BROWSER_RESULT','ACTUAL_PUBLIC_BROWSER_REJECTED','ACTUAL_PUBLIC_BROWSER_RESULT','COMPLETE_BROWSER_CONTEXTS','AGGREGATE_BROWSER_CONTRACT','ACTUAL_BROWSER_INSTRUMENTATION','BOUNDED_JSON','CHILD_TIMEOUT','UNCLASSIFIED')
                  elif key=='browser_exit_code':assert type(item) is int and 0<=item<=256
                  elif key=='diagnostic_source':assert item==os.environ['GITHUB_SHA']
                  elif key=='capture_source':assert item in (os.environ['GITHUB_SHA'],'f1303ee9dfac61fb47fb6820eabd1d04b36f173c') and item==value['source']
                  elif key=='viewports':assert item==[1280,390,320]
                  elif type(item) is str:assert re.fullmatch('[A-Za-z0-9_.-]{1,100}',item)
                  else:assert type(item) in (int,bool) and (type(item) is bool or 0<=item<=100000000000000000000)
          except Exception:
              value=fallback
          p.parent.mkdir(parents=True,exist_ok=True)
          raw=json.dumps(value,sort_keys=True,separators=(',',':')).encode()+b'\n';p.write_bytes(raw)
          print('CODEX_RESULT='+raw.decode().strip())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Public deployment browser acceptance: '+value['status']+'. Resource and operating qualification remain unestablished.\n')
          PY
      - name: Retain only sanitized aggregate acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-generated-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-public-browser-${{ github.run_id }}/report/BROWSER_ACCEPTANCE.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
