name: One-time fictional diagnostic seed preparation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Exact separately approved one-time preparation identifier
        required: true
        type: choice
        default: CANCEL
        options:
          - CANCEL
          - NFL-WEB-CLOUD-SEED-PREP-20261021-045638Z
      storage_approved:
        description: Repeat the preparation identifier after output-content and available-storage approval
        required: true
        type: string
      installed_source:
        description: Exact approved installed development commit, not an application-source override
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: one-time-fictional-seed-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'NickNicky19/nicks-expert-nfl-picks' &&
      github.actor_id == '208912933' &&
      github.ref == 'refs/heads/upgrade/phase2-reproducible-comparison' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'NFL-WEB-CLOUD-SEED-PREP-20261021-045638Z' &&
      inputs.storage_approved == 'NFL-WEB-CLOUD-SEED-PREP-20261021-045638Z' &&
      inputs.installed_source == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PREPARATION_ID: NFL-WEB-CLOUD-SEED-PREP-20261021-045638Z
      APPLICATION_SOURCE: b3de2fbd88ba3247b407a856972285ad10527b99
      APPLICATION_TREE: c0d0d818f8e1266f55851c8c220d44cd94797c78
    steps:
      - name: Observe standard runner before allocation
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -r /proc/meminfo
          test -r /proc/self/mountinfo
          df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp "$HOME"
          cat /proc/meminfo

      - name: Retrieve exact diagnostic installer source
        timeout-minutes: 4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: installer
          fetch-depth: 0
          persist-credentials: false

      - name: Retrieve independent accepted application and legacy objects
        timeout-minutes: 4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: b3de2fbd88ba3247b407a856972285ad10527b99
          path: app
          fetch-depth: 0
          persist-credentials: false

      - name: Set up declared Python
        timeout-minutes: 4
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
          check-latest: false

      - name: Set up declared Node
        timeout-minutes: 4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          check-latest: false

      - name: Install exact declared preparation dependencies
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -r "$GITHUB_WORKSPACE/installer/tools/cloud-seed-requirements.txt"
          python --version
          node --version
          python -m pip freeze --all

      - name: Check complete source closure and early capacity
        timeout-minutes: 3
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/installer" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/app" rev-parse HEAD)" = "$APPLICATION_SOURCE"
          test "$(git -C "$GITHUB_WORKSPACE/app" rev-parse 'HEAD^{tree}')" = "$APPLICATION_TREE"
          python "$GITHUB_WORKSPACE/installer/tools/cloud_seed_prepare.py" preflight \
            --app "$GITHUB_WORKSPACE/app" \
            --work "$RUNNER_TEMP/nfl-seedprep-$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/nfl-seedprep-export-$GITHUB_RUN_ID"

      - name: Require existing ancestor memory controllers without changing them
        timeout-minutes: 1
        id: ancestors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, stat
          from pathlib import Path
          root=Path('/sys/fs/cgroup')
          parents=(root,root/'system.slice')
          records=[]
          for parent in parents:
              info=parent.stat()
              if parent.is_symlink() or info.st_uid!=0 or info.st_mode & (stat.S_IWGRP|stat.S_IWOTH):
                  raise RuntimeError('Unprotected ancestor cgroup; no privileged setup attempted')
              controls=parent/'cgroup.subtree_control'
              data=controls.read_bytes()
              records.append({'path':str(parent),'uid':info.st_uid,'gid':info.st_gid,
                  'mode':stat.S_IMODE(info.st_mode),'control_hex':data.hex(),
                  'controllers_hex':(parent/'cgroup.controllers').read_bytes().hex()})
              if b'memory' not in data.split():
                  raise RuntimeError('Ancestor memory controller must already be enabled; no global change permitted')
          mounts=[line for line in Path('/proc/self/mountinfo').read_text().splitlines()
              if ' - cgroup2 ' in line]
          if len(mounts)!=1 or mounts[0].split()[4]!='/sys/fs/cgroup':
              raise RuntimeError('Unsupported cgroup2 mount layout')
          work=Path(os.environ['RUNNER_TEMP'])/('nfl-seedprep-'+os.environ['GITHUB_RUN_ID'])
          (work/'ANCESTORS.before.json').write_text(json.dumps({'mounts':mounts,'ancestors':records},sort_keys=True)+'\n')
          PY

      - name: Prepare once inside attributable resource and inherited network boundaries
        timeout-minutes: 306
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          installer="$GITHUB_WORKSPACE/installer"
          app="$GITHUB_WORKSPACE/app"
          work="$RUNNER_TEMP/nfl-seedprep-$GITHUB_RUN_ID"
          output="$RUNNER_TEMP/nfl-seedprep-export-$GITHUB_RUN_ID"
          py="$(command -v python)"
          node_bin="$(command -v node)"
          py_actual="$(readlink -f "$py")"
          node_actual="$(readlink -f "$node_bin")"
          requests_file="$("$py" -c 'import requests; print(requests.__file__)')"
          memtotal="$(awk '$1=="MemTotal:" {printf "%.0f\n", $2*1024}' /proc/meminfo)"
          test -n "$memtotal"
          sudo systemd-run --unit "nfl-seedprep-$GITHUB_RUN_ID.service" \
            --wait --pipe --collect --service-type=exec \
            -p User=root -p UMask=0022 \
            -p MemoryAccounting=yes -p "MemoryMax=$memtotal" -p MemorySwapMax=0 \
            -p Delegate=memory -p DelegateSubgroup=supervisor \
            -p RuntimeMaxSec=18300 -p TimeoutStopSec=30 -p KillMode=control-group \
            /usr/bin/env -i \
            "PATH=$(dirname "$py"):$(dirname "$node_bin"):/usr/bin:/bin" \
            "HOME=$HOME" "TMPDIR=$RUNNER_TEMP" "RUNNER_TEMP=$RUNNER_TEMP" \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            "GITHUB_WORKSPACE=$installer" "GITHUB_SHA=$GITHUB_SHA" \
            "$py" "$installer/tools/cloud_seed_resource_bootstrap.py" \
            --unit "nfl-seedprep-$GITHUB_RUN_ID.service" --memory-max "$memtotal" \
            --uid "$(id -u)" --gid "$(id -g)" --run-id "$GITHUB_RUN_ID" \
            --output "$work/RESOURCE.json" \
            --critical-path "$installer" --critical-path "$app" \
            --critical-path "$work" --critical-path "$output" \
            --critical-path "$RUNNER_TEMP" --critical-path /tmp --critical-path "$HOME" \
            --critical-path "$py_actual" --critical-path "$node_actual" --critical-path "$requests_file" \
            --timeout 18000 -- \
            "$py" "$installer/tools/diagnostic_network_guard.py" -- \
            "$py" "$installer/tools/cloud_seed_prepare.py" run \
            --app "$app" --work "$work" --output "$output"

      - name: Verify ancestor controller settings remained unchanged
        timeout-minutes: 1
        if: always() && steps.ancestors.outcome == 'success'
        id: ancestor_check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, stat
          from pathlib import Path
          work=Path(os.environ['RUNNER_TEMP'])/('nfl-seedprep-'+os.environ['GITHUB_RUN_ID'])
          old=json.loads((work/'ANCESTORS.before.json').read_text())
          now=[]
          for record in old['ancestors']:
              parent=Path(record['path']);info=parent.stat()
              now.append({'path':str(parent),'uid':info.st_uid,'gid':info.st_gid,
                  'mode':stat.S_IMODE(info.st_mode),'control_hex':(parent/'cgroup.subtree_control').read_bytes().hex(),
                  'controllers_hex':(parent/'cgroup.controllers').read_bytes().hex()})
          mounts=[line for line in Path('/proc/self/mountinfo').read_text().splitlines() if ' - cgroup2 ' in line]
          result={'mounts':mounts,'ancestors':now}
          (work/'ANCESTORS.after.json').write_text(json.dumps(result,sort_keys=True)+'\n')
          if result!=old:raise RuntimeError('Unexpected ancestor controller/mount/ownership change; no automatic global restoration permitted')
          PY

      - name: Finalize only bounded allowlisted retention contents
        timeout-minutes: 2
        if: always() && steps.preflight.outcome == 'success'
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/installer/tools/cloud_seed_prepare.py" finalize \
            --app "$GITHUB_WORKSPACE/app" \
            --work "$RUNNER_TEMP/nfl-seedprep-$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/nfl-seedprep-export-$GITHUB_RUN_ID"

      - name: Retain only explicitly approved fictional seed or bounded failure checkpoint
        timeout-minutes: 15
        id: upload
        if: always() && steps.finalize.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fictional-seed-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/nfl-seedprep-export-${{ github.run_id }}/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Require complete admitted restoration and actual resource verdict
        timeout-minutes: 1
        if: always() && steps.finalize.outcome == 'success'
        shell: bash
        env:
          ANCESTOR_CHECK_OUTCOME: ${{ steps.ancestor_check.outcome }}
          PREPARATION_STEP_OUTCOME: ${{ steps.prepare.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ACTUAL_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ACTUAL_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ACTUAL_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          output=Path(os.environ['RUNNER_TEMP'])/('nfl-seedprep-export-'+os.environ['GITHUB_RUN_ID'])
          manifest=json.loads((output/'ARTIFACT_MANIFEST.json').read_text())
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write('Preparation: '+manifest['preparation_status']+'; resources: '+manifest['resource_verdict']+'; operating: NOT_RUN\n\n')
              for key in ('ACTUAL_ARTIFACT_ID','ACTUAL_ARTIFACT_DIGEST','ACTUAL_ARTIFACT_URL'):
                  stream.write(key+': '+os.environ.get(key,'')+'\n\n')
          if os.environ['UPLOAD_OUTCOME']!='success':
              raise RuntimeError('Approved output retention failed; runner-local files are not a completed transfer')
          if manifest['preparation_status']!='PREPARATION_COMPLETE_NOT_OPERATING_QUALIFIED':
              raise RuntimeError('No complete admitted/restored full seed; bounded retained failure is not success')
          if manifest['resource_verdict']!='PASS':
              raise RuntimeError('Actual supported resource qualification did not pass')
          if os.environ['ANCESTOR_CHECK_OUTCOME']!='success' or os.environ['PREPARATION_STEP_OUTCOME']!='success':
              raise RuntimeError('Preparation service or ancestor-integrity boundary failed')
          if manifest['operating_qualification']!='NOT_RUN':
              raise RuntimeError('Preparation must not claim hosted operating qualification')
          print('ONE_TIME_PREPARATION_COMPLETE; OPERATING_CAMPAIGN_NOT_RUN')
          PY
