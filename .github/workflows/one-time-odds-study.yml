name: One-time NFL paper odds study
run-name: NFL-WEB-ODDS-ONCE-20261022

on:
  workflow_dispatch:
    inputs:
      installed_source:
        description: Exact accepted installed development SHA; never a source override
        required: true
        type: string
      storage_comment_id:
        description: Existing unedited owner PR 1 approval establishing no-cost storage and output permission
        required: true
        type: string
      confirmation:
        description: One approved paper batch only; no recurring acquisition or retry
        required: true
        type: choice
        default: CANCEL
        options:
          - CANCEL
          - NFL-WEB-ODDS-ONCE-20261022

permissions:
  contents: read
  actions: read

concurrency:
  group: nfl-one-time-paper-odds
  cancel-in-progress: false

jobs:
  paper_study:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'NickNicky19/nicks-expert-nfl-picks' &&
      github.repository_id == '1411185749' &&
      github.actor_id == '208912933' &&
      github.ref == 'refs/heads/upgrade/phase2-reproducible-comparison' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      BATCH_ID: NFL-WEB-ODDS-ONCE-20261022
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Guard exact first invocation before checkout or secret access
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          task_prefix="$(mktemp -d "$RUNNER_TEMP/odds-guard-pyc.XXXXXX")"
          chmod 0700 "$task_prefix"
          export PYTHONPYCACHEPREFIX="$task_prefix"
          printf 'PYTHONPYCACHEPREFIX=%s\n' "$task_prefix" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os, re, stat
          from pathlib import Path
          fd=os.open(os.environ['GITHUB_EVENT_PATH'],os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
          try:
              info=os.fstat(fd)
              if not stat.S_ISREG(info.st_mode) or info.st_size>131072:raise RuntimeError('Bounded dispatch event required')
              raw=os.read(fd,131073)
          finally:os.close(fd)
          if len(raw)>131072:raise RuntimeError('Dispatch event exceeded bound')
          event=json.loads(raw);inputs=event.get('inputs',{})
          expected={'GITHUB_ACTIONS':'true','RUNNER_ENVIRONMENT':'github-hosted',
              'GITHUB_EVENT_NAME':'workflow_dispatch','GITHUB_RUN_ATTEMPT':'1','RUNNER_OS':'Linux','RUNNER_ARCH':'X64',
              'GITHUB_REPOSITORY':'NickNicky19/nicks-expert-nfl-picks','GITHUB_REPOSITORY_ID':'1411185749',
              'GITHUB_ACTOR_ID':'208912933','GITHUB_REF_NAME':'upgrade/phase2-reproducible-comparison'}
          if any(os.environ.get(key)!=value for key,value in expected.items()):raise RuntimeError('Unapproved workflow context')
          if set(inputs)!={'installed_source','storage_comment_id','confirmation'}:raise RuntimeError('Exact input schema required')
          source=inputs['installed_source'];comment=inputs['storage_comment_id']
          if not isinstance(source,str) or not re.fullmatch('[0-9a-f]{40}',source) or source!=os.environ.get('GITHUB_SHA'):
              raise RuntimeError('Actual dispatch source differs from approved source')
          if not isinstance(comment,str) or not re.fullmatch('[1-9][0-9]{0,19}',comment):raise RuntimeError('Exact owner approval comment ID required')
          if inputs['confirmation']!=os.environ['BATCH_ID']:raise RuntimeError('Cancelled or unapproved invocation')
          if any(os.environ.get(key) for key in ('ODDS_API_KEY','GH_TOKEN','GITHUB_TOKEN')):
              raise RuntimeError('Collection credentials must not exist in preflight')
          if any(os.environ.get(key,'').lower()=='true' for key in ('ACTIONS_STEP_DEBUG','ACTIONS_RUNNER_DEBUG')):
              raise RuntimeError('Debug execution is not an approved secret boundary')
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              stream.write('ODDS_INSTALLED_SOURCE='+source+'\n')
              stream.write('ODDS_STORAGE_COMMENT_ID='+comment+'\n')
          print('Exact first-attempt paper-study guards passed; no provider request made')
          PY

      - name: Checkout exact dispatched technical source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up source-CI Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up source-CI Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install existing dependencies without compiled-cache records
        shell: bash
        run: |
          set -euo pipefail
          task_prefix="$(mktemp -d "$RUNNER_TEMP/odds-pip-pyc.XXXXXX")"
          chmod 0700 "$task_prefix"
          PYTHONPYCACHEPREFIX="$task_prefix" python -m pip install --no-compile -r requirements.txt

      - name: Bind fresh public main and freeze exact matching website bytes
        id: freeze
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$ODDS_INSTALLED_SOURCE"
          git diff --exit-code >/dev/null
          git diff --cached --exit-code >/dev/null
          test ! -e "$RUNNER_TEMP/odds-study"
          test ! -L "$RUNNER_TEMP/odds-study"
          task_main_file="$RUNNER_TEMP/odds-main-head.txt"
          timeout --signal=TERM --kill-after=5s 45s git ls-remote --exit-code --refs \
            https://github.com/NickNicky19/nicks-expert-nfl-picks.git refs/heads/main > "$task_main_file"
          task_prefix="$(mktemp -d "$RUNNER_TEMP/odds-main-pyc.XXXXXX")"
          chmod 0700 "$task_prefix"
          PYTHONPYCACHEPREFIX="$task_prefix" python - <<'PY'
          import os, re, stat
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'odds-main-head.txt'
          fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
          try:
              info=os.fstat(fd)
              if not stat.S_ISREG(info.st_mode) or info.st_size>4096:raise RuntimeError('Bounded main reference required')
              raw=os.read(fd,4097)
          finally:os.close(fd)
          if len(raw)>4096:raise RuntimeError('Main reference exceeded bound')
          match=re.fullmatch(rb'([0-9a-f]{40})\trefs/heads/main\n',raw)
          if not match:raise RuntimeError('One exact fresh main SHA required')
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:stream.write('ODDS_MAIN_SHA='+match.group(1).decode()+'\n')
          PY
          task_main_sha="$(cut -f1 "$task_main_file")"
          if ! git cat-file -e "$task_main_sha^{commit}" 2>/dev/null; then
            timeout --signal=TERM --kill-after=5s 60s git fetch --no-tags --no-write-fetch-head origin "$task_main_sha" >/dev/null 2>&1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          task_freeze_prefix="$(mktemp -d "$RUNNER_TEMP/odds-freeze-pyc.XXXXXX")"
          chmod 0700 "$task_freeze_prefix"
          PYTHONPYCACHEPREFIX="$task_freeze_prefix" python tools/odds_study.py freeze \
            --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/odds-study" --main-sha "$task_main_sha" >/dev/null 2>&1

      - name: Collect once after authenticated source storage and credit checks
        id: collect
        timeout-minutes: 20
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          ulimit -c 0
          task_prefix="$(mktemp -d "$RUNNER_TEMP/odds-collect-pyc.XXXXXX")"
          chmod 0700 "$task_prefix"
          set +e
          PYTHONPYCACHEPREFIX="$task_prefix" python tools/odds_study.py collect \
            --directory "$RUNNER_TEMP/odds-study" --code-sha "$GITHUB_SHA" \
            --storage-comment-id "$ODDS_STORAGE_COMMENT_ID" >/dev/null 2>&1
          task_status=$?
          set -e
          printf 'exit_code=%s\n' "$task_status" >> "$GITHUB_OUTPUT"
          printf 'Paper-study collection exited with code %s; no raw response or exception is logged\n' "$task_status"
          exit "$task_status"

      - name: Verify sealed originals and supported incomplete evidence without secrets
        id: verify
        if: >-
          always() && steps.freeze.outcome == 'success' &&
          (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ODDS_API_KEY:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          task_prefix="$(mktemp -d "$RUNNER_TEMP/odds-verify-pyc.XXXXXX")"
          chmod 0700 "$task_prefix"
          PYTHONPYCACHEPREFIX="$task_prefix" python tools/odds_study.py verify \
            --directory "$RUNNER_TEMP/odds-study" >/dev/null 2>&1

      - name: Bundle only allowlisted verified bytes under both upload caps
        id: package
        if: always() && steps.verify.outcome == 'success'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ODDS_API_KEY:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          test ! -e "$RUNNER_TEMP/odds-study.tar.gz"
          test ! -L "$RUNNER_TEMP/odds-study.tar.gz"
          task_prefix="$(mktemp -d "$RUNNER_TEMP/odds-bundle-pyc.XXXXXX")"
          chmod 0700 "$task_prefix"
          PYTHONPYCACHEPREFIX="$task_prefix" python tools/odds_study.py bundle \
            --directory "$RUNNER_TEMP/odds-study" --output "$RUNNER_TEMP/odds-study.tar.gz" >/dev/null 2>&1
          task_check_prefix="$(mktemp -d "$RUNNER_TEMP/odds-cap-pyc.XXXXXX")"
          chmod 0700 "$task_check_prefix"
          PYTHONPYCACHEPREFIX="$task_check_prefix" python - <<'PY'
          import gzip, hashlib, os, stat
          from pathlib import Path
          cap=128*1024**2;path=Path(os.environ['RUNNER_TEMP'])/'odds-study.tar.gz'
          fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
          with os.fdopen(fd,'rb') as stream:
              before=os.fstat(stream.fileno())
              if not stat.S_ISREG(before.st_mode) or not 0<before.st_size<=cap:raise RuntimeError('Archive cap or type rejected')
              digest=hashlib.sha256();encoded=0
              while True:
                  chunk=stream.read(min(1024**2,cap-encoded+1))
                  if not chunk:break
                  encoded+=len(chunk)
                  if encoded>cap:raise RuntimeError('Growing archive exceeded cap')
                  digest.update(chunk)
              stream.seek(0);decoded=0
              with gzip.GzipFile(fileobj=stream,mode='rb') as archive:
                  while True:
                      chunk=archive.read(min(1024**2,cap-decoded+1))
                      if not chunk:break
                      decoded+=len(chunk)
                      if decoded>cap:raise RuntimeError('Decoded archive exceeded cap')
              after=os.fstat(stream.fileno())
              if (before.st_dev,before.st_ino,before.st_size,before.st_mtime_ns,before.st_ctime_ns)!=(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns,after.st_ctime_ns):
                  raise RuntimeError('Archive changed during cap validation')
              if encoded!=before.st_size or decoded==0:raise RuntimeError('Complete nonempty archive required')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('bundle_ready=true\narchive_bytes='+str(encoded)+'\ndecoded_tar_bytes='+str(decoded)+'\narchive_sha256='+digest.hexdigest()+'\n')
          PY

      - name: Retain exactly one approved seven-day paper-study artifact
        id: upload
        if: always() && steps.package.outcome == 'success' && steps.package.outputs.bundle_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NFL-WEB-ODDS-ONCE-20261022-${{ github.run_id }}
          path: ${{ runner.temp }}/odds-study.tar.gz
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          if-no-files-found: error

      - name: Emit only bounded technical aggregate status
        if: always()
        timeout-minutes: 1
        shell: bash
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.verify.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.archive_sha256 }}
          ARCHIVE_BYTES: ${{ steps.package.outputs.archive_bytes }}
        run: |
          set -euo pipefail
          unset ODDS_API_KEY GH_TOKEN GITHUB_TOKEN
          task_summary="$RUNNER_TEMP/odds-public-summary.json"
          task_summary_rc=1
          if [[ -f "$GITHUB_WORKSPACE/tools/odds_study.py" ]]; then
            task_prefix="$(mktemp -d "$RUNNER_TEMP/odds-summary-pyc.XXXXXX")"
            chmod 0700 "$task_prefix"
            set +e
            PYTHONPYCACHEPREFIX="$task_prefix" timeout --signal=TERM --kill-after=5s 20s \
              python tools/odds_study.py summary --directory "$RUNNER_TEMP/odds-study" \
              2>/dev/null | head -c 65537 > "$task_summary"
            task_summary_rc=${PIPESTATUS[0]}
            set -e
          fi
          export ODDS_SUMMARY_EXIT_CODE="$task_summary_rc"
          task_emit_prefix="$(mktemp -d "$RUNNER_TEMP/odds-emit-pyc.XXXXXX")"
          chmod 0700 "$task_emit_prefix"
          PYTHONPYCACHEPREFIX="$task_emit_prefix" python - <<'PY'
          import json, os, re, stat
          from pathlib import Path
          public={'schema_version':'odds-study-workflow-projection-v1','batch_id':os.environ['BATCH_ID'],
              'code_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),
              'collection_outcome':os.environ.get('COLLECTION_OUTCOME','unknown'),
              'integrity_outcome':os.environ.get('INTEGRITY_OUTCOME','unknown'),
              'status':'UNKNOWN','artifact_retrieval':'NOT_YET_VERIFIED','retention_requested_days':7,
              'required_storage_allowance_bytes':136*1024**2}
          path=Path(os.environ['RUNNER_TEMP'])/'odds-public-summary.json'
          if os.environ.get('ODDS_SUMMARY_EXIT_CODE')=='0' and path.is_file() and not path.is_symlink():
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
              try:
                  info=os.fstat(fd);raw=os.read(fd,65537) if stat.S_ISREG(info.st_mode) and info.st_size<=65536 else b''
              finally:os.close(fd)
              try:
                  value=json.loads(raw) if 0<len(raw)<=65536 else None
                  if type(value) is dict and value.get('schema_version')=='odds-study-summary-v1':
                      if value.get('status') in ('VERIFIED_SAVED_BUNDLE','SUCCESS','INCOMPLETE','FAILED','BLOCKED','UNKNOWN','STUDY_STOPPED'):
                          public['status']=value['status']
                      if value.get('batch_status') in ('COMPLETE','FAILED_SAFE'):public['batch_status']=value['batch_status']
                      for key,limit in {'files':256,'decoded_bytes':128*1024**2,'reserved_credits':176,
                          'known_request_credits':176,'quotes':10**6,'comparisons':10**6,'valued':10**6,
                          'unsupported':10**6,'provider_requests':33}.items():
                          if type(value.get(key)) is int and 0<=value[key]<=limit:public[key]=value[key]
                      reasons=value.get('unsupported_reasons',{})
                      allowed={'UNREQUESTED_MARKET','UNSUPPORTED_SIDE','INVALID_PLAYER_PRICE_OR_LINE',
                          'UNRESOLVED_IDENTITY_OR_STATISTIC','KICKOFF_CROSSED','INTEGER_PUSH_PROBABILITY_UNKNOWN',
                          'MISSING_OFFERING_BOOK_SIDE','NO_OTHER_COMPLETE_BOOK_PAIR',
                          'PROVIDER_QUOTE_CLOCK_UNSUPPORTED','UNVERIFIED_OR_INCOMPATIBLE_RULES'}
                      if (type(reasons) is dict and set(reasons)<=allowed and len(reasons)<=len(allowed)
                          and all(type(count) is int and 0<=count<=10**6 for count in reasons.values())):
                          public['unsupported_reasons']={key:reasons[key] for key in sorted(reasons)}
                      else:public['unsupported_reason_projection']='UNSUPPORTED_REASON_SCHEMA'
                      if re.fullmatch('[0-9a-f]{64}',value.get('manifest_sha256','')):public['manifest_sha256']=value['manifest_sha256']
                      if type(value.get('key_rotation_performed')) is bool:public['key_rotation_performed']=value['key_rotation_performed']
              except (ValueError,UnicodeError):pass
          for env,key,pattern in [('ARTIFACT_ID','artifact_id','[1-9][0-9]{0,19}'),
              ('ARTIFACT_DIGEST','artifact_digest','[0-9a-f]{64}'),('ARCHIVE_SHA256','archive_sha256','[0-9a-f]{64}')]:
              if re.fullmatch(pattern,os.environ.get(env,'')):public[key]=os.environ[env]
          size=os.environ.get('ARCHIVE_BYTES','')
          if re.fullmatch('[1-9][0-9]{0,9}',size) and int(size)<=128*1024**2:public['archive_bytes']=int(size)
          encoded=json.dumps(public,sort_keys=True,separators=(',',':'),allow_nan=False)
          print('NFL_ODDS_PAPER_SUMMARY '+encoded)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
              output.write('One-time paper study: '+public['status']+'. Collection '+public['collection_outcome']+'; integrity '+public['integrity_outcome']+'.\n')
              output.write('Artifact retrieval and expiration require actual cloud readback. No website, model, deployment or live-wager claim.\n')
          PY
