name: Reliability tests
on:
  pull_request:
  push:
    branches: ['upgrade/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select explicit release mode
        id: mode
        run: python tools/release_mode.py >> "$GITHUB_OUTPUT"
      - name: Install existing dependencies
        run: pip install -r requirements.txt
      - name: Retained baseline and Phase 2 regression suites
        if: steps.mode.outputs.mode == 'phase1'
        run: |
          if [ '${{ steps.mode.outputs.phase2_enabled }}' = 'true' ]; then
            python -m unittest discover -s tests -v
          else
            python -m unittest discover -s tests -p test_reliability.py -v
            python -m unittest discover -s tests -p test_recovery.py -v
          fi
      - name: Python syntax
        run: python -m compileall -q pull tools
      - run: node --check output/app.js && node --check output/reliability-ui.js && node tests/test-ui.cjs
      - name: About comparison states
        if: steps.mode.outputs.phase2_enabled == 'true'
        run: node tests/test-about.cjs
