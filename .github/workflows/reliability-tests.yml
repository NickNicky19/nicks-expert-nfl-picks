name: Reliability tests
on:
  pull_request:
  push:
    branches: ['upgrade/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select explicit release mode
        id: mode
        run: python tools/release_mode.py >> "$GITHUB_OUTPUT"
      - name: Phase 1 regression suite
        if: steps.mode.outputs.mode == 'phase1'
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q pull tools
      - run: node --check output/app.js && node --check output/reliability-ui.js && node tests/test-ui.cjs
